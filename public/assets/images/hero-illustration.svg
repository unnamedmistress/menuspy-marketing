<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="flow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3394FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#59B3FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EEF7FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#EEF7FF;stop-opacity:0" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F8FAFC"/>
  
  <!-- Flowing particles/path -->
  <path d="M100 400 Q200 200 400 300 T700 250" 
        stroke="url(#flow-gradient)" 
        stroke-width="4" 
        fill="none" 
        filter="url(#glow)"
        opacity="0.6"/>
  
  <path d="M150 450 Q300 300 500 350 T750 280" 
        stroke="#59B3FF" 
        stroke-width="3" 
        fill="none" 
        opacity="0.4"/>
  
  <!-- Document transforming -->
  <g transform="translate(150, 200)">
    <!-- Original document -->
    <rect x="0" y="60" width="80" height="100" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="15" y1="85" x2="65" y2="85" stroke="#94A3B8" stroke-width="3"/>
    <line x1="15" y1="100" x2="55" y2="100" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="15" y1="113" x2="60" y2="113" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="15" y1="126" x2="45" y2="126" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Stamp -->
    <circle cx="55" cy="135" r="15" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="M48 135 L52 139 L62 129" stroke="#10B981" stroke-width="2.5" fill="none"/>
  </g>
  
  <!-- Transformation particles -->
  <g fill="url(#flow-gradient)" filter="url(#glow)">
    <circle cx="240" cy="280" r="6" opacity="0.9"/>
    <circle cx="280" cy="300" r="4" opacity="0.7"/>
    <circle cx="320" cy="285" r="5" opacity="0.8"/>
    <circle cx="360" cy="310" r="3" opacity="0.6"/>
    <circle cx="400" cy="295" r="4" opacity="0.7"/>
    <circle cx="440" cy="305" r="5" opacity="0.8"/>
    <circle cx="480" cy="290" r="4" opacity="0.7"/>
    <circle cx="520" cy="300" r="6" opacity="0.9"/>
    <circle cx="560" cy="285" r="4" opacity="0.6"/>
    <circle cx="600" cy="295" r="5" opacity="0.8"/>
  </g>
  
  <!-- Permit card at destination -->
  <g transform="translate(620, 240)" filter="url(#glow)">
    <rect x="0" y="0" width="100" height="120" rx="12" fill="url(#flow-gradient)"/>
    <rect x="10" y="15" width="80" height="6" rx="3" fill="white" opacity="0.9"/>
    <rect x="10" y="30" width="60" height="4" rx="2" fill="white" opacity="0.6"/>
    <rect x="10" y="40" width="70" height="4" rx="2" fill="white" opacity="0.6"/>
    <rect x="10" y="50" width="50" height="4" rx="2" fill="white" opacity="0.6"/>
    <!-- Checkmark -->
    <circle cx="50" cy="90" r="20" fill="white" opacity="0.2"/>
    <path d="M38 90 L46 98 L62 82" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="680" cy="150" r="80" fill="#EEF7FF" opacity="0.5"/>
  <circle cx="120" cy="500" r="60" fill="#F5F3FF" opacity="0.4"/>
  
  <!-- Stats badges floating -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="120" height="50" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1" filter="url(#glow)"/>
    <text x="15" y="22" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Avg. Approval Time</text>
    <text x="15" y="40" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold" fill="#10B981">14 days</text>
  </g>
  
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="100" height="45" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1" filter="url(#glow)"/>
    <text x="12" y="20" font-family="Inter, sans-serif" font-size="9" fill="#64748B">Predictions</text>
    <text x="12" y="36" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="#3394FF">3,247</text>
  </g>
</svg>