<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3394FF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="neural-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DDD6FE;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#DDD6FE;stop-opacity:0" />
    </radialGradient>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="#F8FAFC"/>
  
  <!-- Neural network center -->
  <g transform="translate(300, 200)">
    <!-- Glow -->
    <circle cx="0" cy="0" r="100" fill="url(#neural-glow)" opacity="0.5"/>
    
    <!-- Central node -->
    <circle cx="0" cy="0" r="25" fill="url(#ai-gradient)" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="12" fill="white" opacity="0.4"/>
    
    <!-- Orbital nodes -->
    <g fill="#8B5CF6" opacity="0.8">
      <circle cx="-60" cy="-40" r="10"/>
      <circle cx="60" cy="-40" r="10"/>
      <circle cx="0" cy="70" r="10"/>
      <circle cx="-55" cy="50" r="8"/>
      <circle cx="55" cy="50" r="8"/>
      <circle cx="-35" cy="-70" r="8"/>
      <circle cx="35" cy="-70" r="8"/>
    </g>
    
    <!-- Connection lines -->
    <g stroke="url(#ai-gradient)" stroke-width="2" opacity="0.4" fill="none">
      <line x1="0" y1="0" x2="-60" y2="-40"/>
      <line x1="0" y1="0" x2="60" y2="-40"/>
      <line x1="0" y1="0" x2="0" y2="70"/>
      <line x1="-60" y1="-40" x2="-35" y2="-70"/>
      <line x1="60" y1="-40" x2="35" y2="-70"/>
      <line x1="-60" y1="-40" x2="-55" y2="50"/>
      <line x1="60" y1="-40" x2="55" y2="50"/>
      <line x1="-55" y1="50" x2="0" y2="70"/>
      <line x1="55" y1="50" x2="0" y2="70"/>
    </g>
  </g>
  
  <!-- Chat bubbles -->
  <g transform="translate(80, 120)">
    <!-- User message -->
    <rect x="0" y="0" width="140" height="45" rx="16" fill="#E2E8F0"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="12" fill="#334155">I want to build a</text>
  </g>
  
  <g transform="translate(380, 120)">
    <!-- AI response -->
    <rect x="0" y="0" width="160" height="70" rx="16" fill="url(#ai-gradient)"/>
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="12" fill="white">Great! For decks I'll help</text>
    <text x="20" y="46" font-family="Inter, sans-serif" font-size="12" fill="white">you check requirements.</text>
  </g>
  
  <!-- Permit document icons floating -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="50" height="65" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="8" y1="15" x2="42" y2="15" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="8" y1="26" x2="35" y2="26" stroke="#E2E8F0" stroke-width="2"/>
    <line x1="8" y1="35" x2="38" y2="35" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="8" y="48" width="20" height="10" rx="3" fill="#10B981" opacity="0.3"/>
  </g>
  
  <g transform="translate(450, 340)">
    <rect x="0" y="0" width="45" height="58" rx="6" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="22" cy="22" r="10" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="22" y1="16" x2="22" y2="22" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="22" y1="22" x2="27" y2="22" stroke="#8B5CF6" stroke-width="2"/>
  </g>
  
  <!-- Input area at bottom -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="400" height="50" rx="25" fill="white" stroke="#CBD5E1" stroke-width="2"/>
    <text x="24" y="32" font-family="Inter, sans-serif" font-size="14" fill="#94A3B8">Ask about your project...</text>
    <!-- Send button -->
    <circle cx="365" cy="25" r="18" fill="url(#ai-gradient)"/>
    <path d="M358 25 L368 25 M364 20 L368 25 L364 30" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative curved lines -->
  <path d="M500 150 Q550 200 500 250" stroke="#DDD6FE" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M100 250 Q50 300 100 350" stroke="#EEF7FF" stroke-width="2" fill="none" opacity="0.6"/>
</svg>